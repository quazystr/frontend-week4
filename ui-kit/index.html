<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="header">
      <a class="header__logo" href="#">ui-kit</a>
      <nav class="header__nav">
        <ul class="menu">
          <li class="menu__item">
            <a class="menu__link" href="#colors">Цвета</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Акции</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Контакты</a>
          </li>
        </ul>
      </nav>
    </div>

    <section id="colors" class="showcase">
      <h2 class="showcase__title">Палитра цветов</h2>
      <p class="showcase__text">Цвета, используемые в проекте</p>

      <div class="swatch">
        <div class="swatch--primary">
          <span class="swatch__name">primary</span>
        </div>
        <div class="swatch--secondary">
          <span class="swatch__name">secondary</span>
        </div>
        <div class="swatch--success">
          <span class="swatch__name">success</span>
        </div>
        <div class="swatch--danger">
          <span class="swatch__name">danger</span>
        </div>
        <div class="swatch--warning">
          <span class="swatch__name">warning</span>
        </div>
        <div class="swatch--info">
          <span class="swatch__name">info</span>
        </div>
        <div class="swatch--light">
          <span class="swatch__name">light</span>
        </div>
        <div class="swatch--dark">
          <span class="swatch__name">dark</span>
        </div>
      </div>
    </section>
    <section id="colors" class="showcase">
      <h2 class="showcase__title">Кнопки</h2>
      <p class="showcase__text">Разные виды кнопок, а также недоступные</p>

      <button class="button">Первичная обычная</button>
      <button class="button button--small">Первичная маленькая</button>
      <button class="button" disabled>Первичная отключенная</button>

      <button class="button button--secondary">Вторичная обычная</button>
      <button class="button button--secondary button--small">
        Вторичная маленькая
      </button>
      <button class="button" disabled>Вторичная отключенная</button>

      <button class="button button--danger">Опасная</button>
      <button class="button button--danger button--small">
        Опасная маленькая
      </button>
      <button class="button" disabled>Опасная отключенная</button>
    </section>
    <section id="badges" class="showcase">
      <h2 class="showcase__title">Бейджи</h2>
      <p class="showcase__text">Статусы заказов</p>

      <div class="badge">
        <h2>Новый</h2>
        <h2 class="badge--success">Оплачен</h2>
        <h2 class="badge--warning">В обработке</h2>
        <h2 class="badge--danger">Отменен</h2>
      </div>
    </section>
  </body>
</html>
